[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apo-cli"
version = "0.1.0"
description = "Turn conversations into contracts. Intent spec compiler for human-AI collaboration."
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["intent", "specification", "llm", "ai", "collaboration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "litellm>=1.0",
    "python-frontmatter>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/thrialectics/apo"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
apo = "apo.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apo = ["templates/**/*.md", "skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.apo]
# Project-level apo configuration (example)
# model = "anthropic/claude-sonnet-4-20250514"
# default_author = "human:marianne"
# intents_dir = "docs/intents"
